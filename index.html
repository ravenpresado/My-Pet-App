<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Pet App</h1>

        <!-- Animal Category -->
        <div class="form-group">
            <label for="animalCategory">Select Animal Category:</label>

            <div class="select-wrapper">
                <span class="select-icon" id="categoryIcon">🐾</span>

                <select id="animalCategory">
                    <option value="dogs">Dogs</option>
                    <option value="cats">Cats</option>
                    <option value="birds">Birds</option>
                    <option value="fishes">Fishes</option>
                    <option value="horses">Horses</option>
                    <option value="chickens">Chickens</option>
                </select>

                <button type="button" class="select-arrow" id="categoryArrow" aria-label="Open animal categories">
                    ▼
                </button>
            </div>
        </div>

        <!-- Breed or Type -->
        <div class="form-group">
            <label for="breedSelect">Select Breed or Type:</label>

            <div class="select-wrapper">
                <span class="select-icon" id="breedIcon">🐾</span>

                <select id="breedSelect">
                    <option value="">Loading animals...</option>
                </select>

                <button type="button" class="select-arrow" id="breedArrow" aria-label="Open animal breeds">
                    ▼
                </button>
            </div>
        </div>

        <!-- Animal Image -->
        <div class="image-container">
            <div id="imageGallery" class="image-gallery"></div>
            <p id="status"></p>
        </div>

        <button id="fetchButton" type="button">FETCH</button>

        <h2>Animal Information</h2>

        <!-- Animal Information Table -->
        <table>
            <thead>
                <tr>
                    <th>Element</th>
                    <th>Type</th>
                    <th>Meaning</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td id="element1">Waiting for animal selection...</td>
                    <td id="type1">Waiting for breed selection...</td>
                    <td id="meaning1">Waiting for information...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
