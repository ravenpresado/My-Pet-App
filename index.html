
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pet App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Pet App</h1>

       <div class="form-group">
    <label for="animalCategory">Select Animal Category:</label>

    <select id="animalCategory">
        <option value="dogs">Dogs</option>
        <option value="cats">Cats</option>
        <option value="birds">Birds</option>
        <option value="fishes">Fishes</option>
        <option value="horses">Horses</option>
        <option value="chickens">Chickens</option>
    </select>
</div>

<div class="form-group">
    <label for="breedSelect">Select Breed or Type:</label>

    <select id="breedSelect">
        <option value="">Loading animals...</option>
    </select>
</div>

        <div class="image-container">
            <img id="dogImage" src="" alt="Dog Image">
            <p id="status">Loading dog breeds...</p>
        </div>

        <button id="fetchButton">FETCH</button>

        <table>
            <thead>
                <tr>
                    <th>Element</th>
                    <th>Type</th>
                    <th>Meaning</th>
                </tr>
            </thead>
<tbody>
    <tr>
        <td id="element1">Breed Name</td>
        <td id="type1">Dog Breed</td>
        <td id="meaning1">Waiting for breed selection...</td>
    </tr>

    <tr>
        <td id="element2">Origin</td>
        <td id="type2">Breed Information</td>
        <td id="meaning2">Waiting for breed selection...</td>
    </tr>

    <tr>
        <td id="element3">Temperament</td>
        <td id="type3">Personality</td>
        <td id="meaning3">Waiting for breed selection...</td>
    </tr>
</tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
