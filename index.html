
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pet App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>My Pet App</h1>
        <h3>Final Activity - SIA Subject</h3>

        <div class="form-group">
            <label for="breedSelect">Select Dog Breed:</label>

            <select id="breedSelect">
                <option value="">Loading breeds...</option>
            </select>
        </div>

        <div class="image-container">
            <img id="dogImage" src="" alt="Dog Image">
            <p id="status">Loading dog breeds...</p>
        </div>

        <button id="fetchButton">FETCH</button>

        <h2>Elements, Type, and Meaning</h2>

        <table>
            <thead>
                <tr>
                    <th>Element</th>
                    <th>Type</th>
                    <th>Meaning</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Dog Breed</td>
                    <td>Combo Box</td>
                    <td>Select a dog breed.</td>
                </tr>

                <tr>
                    <td>Dog Image</td>
                    <td>Image Display</td>
                    <td>Displays a random image of the selected breed.</td>
                </tr>

                <tr>
                    <td>FETCH</td>
                    <td>Button</td>
                    <td>Fetches a new random dog image.</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
